name: Gradle Build (Development)

# Validate this fork without requiring upstream Maven publishing credentials.
# Publishing remains an explicit operation through the existing Release workflow.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grimapi-development
          path: |
            build/libs/*.jar
            grim-*/build/libs/*.jar
          if-no-files-found: error
